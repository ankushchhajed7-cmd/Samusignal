name: S6 research (gold hedge ladder backtest)
on:
  workflow_dispatch:
  push:
    branches: [ccr-de58b3c2-9qoj0z]
    paths: ['research/s6_backtest.py', 'research/s6_bt2.py', '.github/workflows/s6-research.yml']
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: S6 v9.0 vs suggested changes on real gold (Yahoo GC=F 1m 7d + 5m 60d)
        run: python3 -u research/s6_bt2.py
      - name: Same rules on BTC (Yahoo BTC-USD, 0.01 lot = $0.01 per $1 -> scaled x0.01)
        env: {S6_SYM: BTC-USD, S6_SCALE: "0.01", S6_LABEL: BTC}
        run: python3 -u research/s6_bt2.py
