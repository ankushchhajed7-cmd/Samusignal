name: Auto Signal (Telegram)

# Har 30 min (Som–Shukra). Asli waqt ki seema bot/config.json ke hoursIST se —
# script khud dekhti hai, isliye cron thoda chauda rakha hai.
# GitHub ka timer kabhi 5–15 min late chalta hai.
on:
  schedule:
    - cron: '7,37 5-18 * * 1-5'
  workflow_dispatch:        # Actions tab → "Run workflow" = abhi chalao + test message

concurrency:
  group: auto-signal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.56.1

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Restore robot memory
        uses: actions/cache/restore@v4
        with:
          path: bot-state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run robot
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BOT_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node bot/auto-signal.mjs

      - name: Save robot memory
        if: always() && hashFiles('bot-state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: bot-state
          key: bot-state-${{ github.run_id }}
