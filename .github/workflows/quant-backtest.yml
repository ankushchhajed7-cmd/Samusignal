name: SamuQuant Backtest

# Strategy/backtest badle to (ya haath se "Run workflow") — Dukascopy se asli
# H1 data (2016 se) laata hai, backtest chalata hai, aur quant/report.html +
# quant/results.json usi branch pe commit kar deta hai. Har mahine bhi naye data pe.
on:
  push:
    paths:
      - 'quant/strategy.mjs'
      - 'quant/backtest.mjs'
      - 'quant/fetch-data.mjs'
      - 'quant/research-pairs.txt'
      - '.github/workflows/quant-backtest.yml'
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:

concurrency:
  group: quant-backtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Data cache
        uses: actions/cache@v4
        with:
          path: quant/data
          key: quant-data-${{ github.run_id }}
          restore-keys: quant-data-

      - name: Install dukascopy-node
        run: npm install --no-save --no-package-lock dukascopy-node@1.50.0

      - name: Download H1 data (Dukascopy, incremental)
        timeout-minutes: 150
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          save(){   # har download ke baad data turant commit — beech me ruke to bhi bacha rahe
            mkdir -p quant/history
            for f in quant/data/*_H1*.csv; do [ -f "$f" ] && gzip -9 -n -c "$f" > "quant/history/$(basename "$f").gz"; done
            git add quant/history
            git diff --cached --quiet && return 0
            git commit -q -m "SamuQuant data update: $1 [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0; sleep 5; done
          }
          R=""; [ -f quant/research-pairs.txt ] && R="$(tr -d ' \n' < quant/research-pairs.txt)"
          if [ -n "$R" ]; then
            for p in ${R//,/ }; do node quant/fetch-data.mjs 2013-01-01 bid "$p" || true; save "$p bid"; done
          fi
          node quant/fetch-data.mjs 2008-01-01 bid || true; save "EURUSD/XAUUSD bid"
          if [ -n "$R" ]; then
            for p in ${R//,/ }; do node quant/fetch-data.mjs 2013-01-01 ask "$p" || true; save "$p ask"; done
          fi
          node quant/fetch-data.mjs 2008-01-01 ask || true; save "EURUSD/XAUUSD ask"

      - name: Pack history
        if: always()
        run: |
          mkdir -p quant/history
          for f in quant/data/*_H1*.csv; do [ -f "$f" ] && gzip -9 -n -c "$f" > "quant/history/$(basename "$f").gz"; done
          ls -la quant/history

      - name: Run backtest
        if: always()
        run: node quant/backtest.mjs

      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add quant/report.html quant/results.json quant/history
          if git diff --cached --quiet; then echo "Report me koi badlav nahi"; exit 0; fi
          git commit -m "SamuQuant backtest report update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
